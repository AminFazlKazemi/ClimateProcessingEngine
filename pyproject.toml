[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "climatology-engine"
version = "4.0.0"
description = "Climate Climatology Engine with advanced distribution fitting"
authors = [
    {name = "Your Name", email = "your@email.com"},
]
license = {file = "LICENSE"}
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.21",
    "scipy>=1.7",
    "xarray>=0.20",
    "zarr>=2.10",
    "numba>=0.55",
    "matplotlib>=3.4",
    "seaborn>=0.11",
    "pandas>=1.3",
    "tqdm>=4.62",
    "pyyaml>=5.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "sphinx>=5.0",
    "myst-parser",
    "black",
    "flake8",
]
