# ============================================================================
# تنظیمات اصلی پروژه Climatology Engine v3.0
# ============================================================================

project:
  name: "Climatology Engine v3.0"
  version: "3.0"

# ============================================================================
# مسیرها (بر اساس مسیرهای واقعی شما)
# ============================================================================
paths:
  # ⚠️ مهم: مسیر پوشه حاوی فایل‌های Zarr ماهانه ورودی
  # اگر هنوز داده‌های خود را به Zarr تبدیل نکرده‌اید، این مسیر را تنظیم کنید.
  # ساختار مورد انتظار: [year]_[month].zarr (مثلاً 1370_1.zarr)
  input_zarr_base: "M:/temp/zarr_input"   # ← این را به مسیر واقعی Zarrهای خود تغییر دهید

  # مسیر خروجی (همان مسیری که قبلاً checkpoint در آن ذخیره میشد)
  output_dir: "./nature_output"
  output_zarr_name: "climatology_stationwise_final.zarr"

  # مسیر checkpoint
  checkpoint_dir: "./nature_output"

  # مسیر لاگ‌ها
  log_dir: "./logs"

  # مسیر کش دیسکی (برای افزایش سرعت)
  cache_dir: "./cache"

  # (اختیاری) مسیر فایل متادیتا - برای استفاده در آینده یا اسکریپت‌های جانبی
  metadata_file: "K:/gozareshha/dr vazife/140504 - qc temp/st_metadata_revised.txt"

# ============================================================================
# بازه زمانی (سال‌های شمسی)
# ============================================================================
time:
  start_year: 1370   # 1991
  end_year: 1399     # 2020

# ============================================================================
# پارامترهای پردازش
# ============================================================================
processing:
  block_size: 1000                # تعداد نقاط در هر بلوک (اگر کند بود به ۵۰۰ کاهش دهید)
  max_blocks_in_memory: 5         # تعداد بلوک‌های همزمان در حافظه
  chunk_size: [100, 100]          # اندازه تکه‌های Zarr برای ذخیره‌سازی
  compression: "zstd"             # الگوریتم فشرده‌سازی
  compression_level: 3
  n_points_max: 40000             # حداکثر تعداد نقاط (افزایش از ۵۰۰۰ به ۴۰۰۰۰)

# ============================================================================
# پنجره و حالت حدی (پیش‌فرض غیرفعال است)
# ============================================================================
window:
  days: 2                         # ±۲ روز (پنجره ۵ روزه)
  use_extreme_values: false       # true = حالت حدی (فعال شدن GEV), false = حالت عادی

# ============================================================================
# فرمت داده ورودی (تشخیص خودکار)
# ============================================================================
data_format: "auto"               # auto, station, gridded

# محدوده جغرافیایی (فقط برای داده‌های شبکه‌ای - Gridded)
lat_min: 25
lat_max: 40
lon_min: 44
lon_max: 64

# ============================================================================
# تنظیمات کش (برای افزایش سرعت در اجرای مجدد)
# ============================================================================
cache:
  enabled: true
  max_size_gb: 10                 # حداکثر حجم کش بر حسب گیگابایت
  ttl_hours: 24                   # مدت اعتبار کش (۲۴ ساعت)

# ============================================================================
# تنظیمات لاگ
# ============================================================================
logging:
  level: "INFO"                   # DEBUG, INFO, WARNING, ERROR
  file_rotation: "10 MB"          # چرخش لاگ بعد از ۱۰ مگابایت
  console_output: true

# ============================================================================
# تنظیمات تحلیل (برای اسکریپت analyze_distributions.py)
# ============================================================================
analysis:
  output_dir: "./analysis_output"
  interactive_maps: true
  clustering:
    enabled: true
    n_clusters: 4
  autocorrelation:
    max_lag: 30
  correlation:
    include_features: ["mean", "std", "skew", "count", "elev"]